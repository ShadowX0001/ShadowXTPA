# =====================================
#           SHADOWXTPA CONFIG
# =====================================

settings:

  request-timeout: 60

  teleport-delay: 5

  cooldown: 30

  max-pending-requests: 5

  history-limit: 20

  cancel-on-move: true

  cancel-on-damage: true

  cancel-on-death: true

  cancel-on-world-change: true

  allow-cross-world: true

  prevent-duplicate-requests: true

  request-toggle-default: true

  ignore-system: true

  debug: false

sounds:

  enabled: true

  volume: 1.0

  pitch: 1.0

  request-sent: UI_BUTTON_CLICK

  request-received: BLOCK_NOTE_BLOCK_PLING

  request-accepted: ENTITY_PLAYER_LEVELUP

  request-denied: BLOCK_NOTE_BLOCK_BASS

  request-cancelled: BLOCK_NOTE_BLOCK_BASS

  teleport-countdown: BLOCK_NOTE_BLOCK_PLING

  teleport-success: ENTITY_ENDERMAN_TELEPORT

  teleport-cancel: BLOCK_NOTE_BLOCK_BASS
