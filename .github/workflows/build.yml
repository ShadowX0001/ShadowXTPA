name: ShadowXTPA Build

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build ShadowXTPA
        run: mvn -B clean package

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ShadowXTPA-1.0.0
          path: target/ShadowXTPA-1.0.0.jar
